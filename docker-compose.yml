services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: claims
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"

  keycloak:
    image: keycloak/keycloak:26.4.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./docker/expenses-realm.json:/opt/keycloak/data/import/expenses-realm.json
