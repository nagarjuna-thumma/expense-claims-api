# Local development only. In a real cluster these come from a secret manager
# (External Secrets, Sealed Secrets or Vault), not from git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  username: app
  password: app
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
type: Opaque
stringData:
  username: admin
  password: admin
