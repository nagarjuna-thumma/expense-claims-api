apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: expense-claims

resources:
  - namespace.yaml
  - secret.yaml
  - postgres.yaml
  - keycloak.yaml
  - api.yaml

# Reuses the realm file from docker/, so build with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s | kubectl apply -f -
configMapGenerator:
  - name: keycloak-realm
    files:
      - ../docker/expenses-realm.json
